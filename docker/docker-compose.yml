version: "3.8"

services:
  arena-kicad-library-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: arena-kicad-library-sync
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/arena_library.db
    restart: unless-stopped
